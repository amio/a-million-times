<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f3">
<meta name="description" content="A browser recreation of Humans since 1982’s A Million Times: synchronized clock hands forming patterns and telling time.">
<title>A Million Times 144</title>
<style>
  :root { color-scheme:light; --paper:#f5f5f3; --ink:#252724; --muted:#757872; --line:#dedfda; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow:hidden; }
  button,input,select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible { outline:2px solid var(--ink); outline-offset:4px; }
  main { position:fixed; inset:0; display:grid; place-items:center; }
  canvas { display:block; outline:none; }
  .top { position:fixed; inset:26px 32px auto; display:flex; align-items:center; justify-content:space-between; gap:20px; pointer-events:none; }
  .signature { font-size:14px; font-weight:500; letter-spacing:.015em; }
  .edition { color:var(--muted); font-weight:400; }
  .top button,.bottom button { pointer-events:auto; }
  .quiet { background:none; border:0; padding:8px 10px; color:var(--muted); border-radius:4px; }
  .quiet:hover,.quiet[aria-expanded="true"] { color:var(--ink); background:#e9eae5; }
  .bottom { position:fixed; inset:auto 32px 24px; display:flex; align-items:flex-end; justify-content:space-between; gap:24px; pointer-events:none; }
  .bottom-left { display:flex; align-items:center; flex-wrap:wrap; gap:6px 24px; min-width:0; }
  .current { display:flex; align-items:center; gap:12px; min-width:0; color:var(--muted); font-size:12px; }
  #sequenceNumber { font-variant-numeric:tabular-nums; flex-shrink:0; }
  #sceneName { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:190px; }
  .track { width:54px; height:2px; background:var(--line); flex-shrink:0; }
  #progress { display:block; height:100%; background:var(--muted); transform:scaleX(0); transform-origin:left; }
  .transport { display:flex; align-items:center; gap:10px; }
  .transport button { font-size:13px; }
  #settings { flex-shrink:0; }
  .panel { position:fixed; z-index:2; right:32px; width:340px; max-height:calc(100dvh - 154px); overflow:auto; overscroll-behavior:contain; padding:20px; background:rgba(250,250,248,.97); border:1px solid var(--line); border-radius:8px; box-shadow:0 12px 40px #00000008; }
  .control-panel { bottom:78px; }
  .about-panel { top:78px; }
  .panel-header { display:flex; align-items:center; justify-content:space-between; margin:-6px -8px 16px 0; gap:16px; }
  .panel-header h2 { margin:0; font-size:14px; font-weight:500; }
  .about-panel p { color:var(--muted); margin:0 0 18px; line-height:1.65; }
  .about-panel a { color:inherit; text-underline-offset:3px; }
  .about-panel .source { color:var(--ink); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
  label,.label { font-size:13px; color:var(--muted); }
  select,input[type="text"] { background:transparent; border:1px solid var(--line); border-radius:4px; padding:7px 8px; min-width:0; }
  select { max-width:190px; }
  input[type="range"] { width:144px; accent-color:var(--ink); }
  #speedValue { display:inline-block; min-width:36px; text-align:right; color:var(--ink); }
  .divider { height:1px; background:var(--line); margin:20px 0; }
  .text-form { display:flex; gap:8px; margin-top:9px; }
  .text-form input { flex:1; width:160px; text-transform:uppercase; }
  .solid { border:1px solid var(--ink); background:var(--ink); color:var(--paper); border-radius:4px; padding:7px 11px; }
  .patterns { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px; }
  .patterns button { padding:8px 4px; font-size:12px; border:1px solid var(--line); background:transparent; border-radius:4px; }
  .patterns button:hover,.patterns button[aria-pressed="true"] { border-color:var(--ink); }
  #textError { color:#965039; min-height:18px; font-size:12px; margin-top:5px; }
  @media(max-width:600px) {
    .top { inset:18px 18px auto; } .bottom { inset:auto 18px 18px; gap:12px; }
    .bottom-left { flex:1; flex-direction:column; align-items:flex-start; gap:4px; }
    .current { width:100%; gap:7px; } #sceneName { max-width:none; }
    .panel { right:18px; width:min(340px,calc(100vw - 36px)); max-height:calc(100dvh - 160px); }
    .control-panel { bottom:96px; } .about-panel { top:70px; }
    .transport { gap:0; margin-left:-10px; } .track { width:30px; }
  }
  @media(max-height:420px) { .top { top:10px; } .bottom { bottom:8px; } .panel { max-height:calc(100dvh - 116px); } .control-panel { bottom:60px; } .about-panel { top:53px; } }
  @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto; } }
</style>
</head>
<body>
<main><canvas id="clock" role="img" tabindex="-1" aria-label="A kinetic clock made of 144 two-hand clocks"></canvas></main>
<header class="top">
  <strong class="signature">A Million Times <span class="edition">144</span></strong>
  <button id="about" class="quiet" aria-expanded="false" aria-controls="aboutPanel">About</button>
</header>
<aside id="aboutPanel" class="panel about-panel" hidden aria-labelledby="aboutTitle">
  <div class="panel-header"><h2 id="aboutTitle">A Million Times <span class="edition">144</span></h2><button id="closeAbout" class="quiet" aria-label="Close about">×</button></div>
  <p>A tribute to <a href="https://www.humanssince1982.com/" target="_blank" rel="noreferrer">Humans since 1982</a>’s A Million Times, recreating its synchronized clock hands as they form abstract patterns and tell time.</p>
  <a class="source" href="https://github.com/amio/a-million-times" target="_blank" rel="noreferrer">View source ↗</a>
</aside>
<aside id="panel" class="panel control-panel" hidden aria-labelledby="controlsTitle">
  <div class="panel-header"><h2 id="controlsTitle">Controls</h2><button id="closeControls" class="quiet" aria-label="Close controls">×</button></div>
  <div class="row"><label for="mode">Mode</label><select id="mode"><option value="exhibition">Exhibition · Continuous</option><option value="active">Active · Every minute</option><option value="original">Original · Radial</option><option value="minimal">Minimal · Time only</option></select></div>
  <div class="row"><label for="choreography">Sequence</label><select id="choreography"></select></div>
  <div class="row"><label for="speed">Speed <output id="speedValue">1×</output></label><input id="speed" type="range" min="0.25" max="3" value="1" step="0.25"></div>
  <div class="row"><label for="format">Time format</label><select id="format"><option value="24">24-hour</option><option value="12">12-hour</option></select></div>
  <div class="divider"></div>
  <label for="text">Text</label>
  <form id="textForm" class="text-form"><input id="text" type="text" maxlength="4" value="TIME" aria-describedby="textError" autocomplete="off" spellcheck="false"><button class="solid" type="submit">Show</button></form>
  <div id="textError" role="status"></div>
  <div class="label">Static patterns</div>
  <div id="patterns" class="patterns"></div>
</aside>
<footer id="toolbar" class="bottom" hidden>
  <div class="bottom-left">
    <div class="current"><span id="sequenceNumber"></span><span class="track"><i id="progress"></i></span><span id="sceneName">Radial ripples</span></div>
    <div class="transport"><button id="timeButton" class="quiet">Time</button><button id="pause" class="quiet" aria-label="Pause animation">Pause</button><button id="next" class="quiet" aria-label="Next sequence">Next ↗</button></div>
  </div>
  <button id="settings" class="quiet" aria-expanded="false" aria-controls="panel">Controls</button>
</footer>
<script>
/*
 * Independent study of Humans since 1982's motion language. No original software or
 * assets are used. The 18 × 8 layout follows AMT144; choreography is independently authored.
 * Pattern owns poses; Score owns unwrapped per-hand trajectories; Director owns
 * sequencing. Rendering never changes hand geometry to manufacture a pattern.
 */
'use strict';
const ClockCore = (() => {
  const TAU = Math.PI * 2, PI = Math.PI, COLS = 18, ROWS = 8, COUNT = COLS * ROWS;
  const PARK = PI * .75;
  const clamp = (v,lo=0,hi=1) => Math.max(lo,Math.min(hi,v));
  const mod = (x,n=TAU) => ((x%n)+n)%n;
  const wrap = x => mod(x+PI)-PI;
  const cells = Array.from({length:COUNT},(_,i) => {
    const col=i%COLS,row=Math.floor(i/COLS),x=col-(COLS-1)/2,y=row-(ROWS-1)/2;
    return {i,col,row,x,y,r:Math.hypot(x,y),phi:Math.atan2(y,x)};
  });
  const tiles = {
    '/':[PARK,PARK], '-':[0,PI], '|':[PI/2,-PI/2],
    '┌':[0,PI/2], '┐':[PI,PI/2], '└':[0,-PI/2], '┘':[PI,-PI/2],
    'v':[PI/2,PI/2], '^':[-PI/2,-PI/2], '>':[0,0], '<':[PI,PI],
    '╱':[-PI/4,PI*.75], '╲':[PI/4,-PI*.75],
    '∧':[PI/4,PI*.75], '∨':[-PI/4,-PI*.75]
  };
  // Each character is a 3 × 6 tile font. Two rays remain present in every tile.
  // 0/3/4/5/9 are transcribed from official AMT120/144 time photographs; remaining
  // digits follow the same outline grammar. Opposite rays make a full stroke,
  // coincident rays make its half-length terminals, including the inner slit of 0.
  const glyphs = {
    '0':['┌-┐','|v|','|||','|||','|^|','└-┘'],
    '1':['/┌┐','/||','/||','/||','/||','/└┘'],
    '2':['┌-┐','└┐|','┌┘|','|┌┘','|└┐','└-┘'],
    '3':['┌-┐','└┐|','┌┘|','└┐|','┌┘|','└-┘'],
    '4':['┌┐┐','|||','|└|','└┐|','/||','/└┘'],
    '5':['┌-┐','|┌┘','|└┐','└┐|','┌┘|','└-┘'],
    '6':['┌-┐','|┌┘','|└┐','|v|','|^|','└-┘'],
    '7':['┌-┐','└┐|','/||','/||','/||','/└┘'],
    '8':['┌-┐','|v|','|^|','|v|','|^|','└-┘'],
    '9':['┌-┐','|v|','|^|','└┐|','┌┘|','└-┘'],
    A:['┌-┐','|/|','|/|','|-|','|/|','^/^'],
    B:['┌-┐','|/|','└-┘','┌-┐','|/|','└-┘'],
    C:['┌-<','|//','|//','|//','|//','└-<'],
    D:['┌-┐','|/|','|/|','|/|','|/|','└-┘'],
    E:['┌-<','|//','└-<','┌//','|//','└-<'],
    F:['┌-<','|//','└-<','v//','|//','^//'],
    G:['┌-<','|//','|//','|>┐','|/|','└-┘'],
    H:['v/v','|/|','└-┘','┌-┐','|/|','^/^'],
    I:['>-<','/v/','/|/','/|/','/^/','>-<'],
    J:['>-┐','//|','//|','v/|','|/|','└-┘'],
    K:['v/v','|╱^','└┘/','┌┐/','|╲v','^/^'],
    L:['v//','|//','|//','|//','|//','└-<'],
    M:['┌∧┐','|v|','|||','|^|','|/|','^/^'],
    N:['v/v','|╲|','|╲|','|╲|','|╲|','^/^'],
    O:['┌-┐','|/|','|/|','|/|','|/|','└-┘'],
    P:['┌-┐','|/|','|/|','┌-┘','|//','^//'],
    Q:['┌-┐','|/|','|/|','|/|','|╲|','└-╲'],
    R:['┌-┐','|/|','┌-┘','|╲/','|╲/','^/╲'],
    S:['┌-<','|//','└-┐','//|','//|','>-┘'],
    T:['>-<','/v/','/|/','/|/','/|/','/^/'],
    U:['v/v','|/|','|/|','|/|','|/|','└-┘'],
    V:['v/v','|/|','|/|','|/|','╲/╱','/∨/'],
    W:['v/v','|/|','|v|','|||','|^|','└∨┘'],
    X:['v/v','╲/╱','/∨/','/∧/','╱/╲','^/^'],
    Y:['v/v','|/|','└∨┘','/|/','/|/','/^/'],
    Z:['>-┐','//|','/╱^','v╱/','|//','└-<'],
    ' ':['///','///','///','///','///','///'],
    '-':['///','///','>-<','///','///','///']
  };
  function textPose(text, isTime=false) {
    text=text.toUpperCase().slice(0,4);
    const pose=Array.from({length:COUNT},()=>[PARK,PARK]);
    const base=Math.floor((COLS-14)/2);
    const starts=isTime?[base,base+3,base+8,base+11]:Array.from({length:text.length},(_,i)=>Math.floor((COLS-(text.length*4-1))/2)+i*4);
    [...text].forEach((char,j) => {
      if(!glyphs[char]) throw new Error('Unsupported character: '+char);
      glyphs[char].forEach((line,row) => [...line].forEach((tile,col) => {
        pose[(row+1)*COLS+starts[j]+col]=tiles[tile].slice();
      }));
    });
    // AMT144 packs HH and MM without a parked column between their digits. Its
    // colon is two 2 × 2 loops, eight clocks in total, using the same fixed hands.
    if(isTime) for(const row of [2,4]) {
      pose[row*COLS+base+6]=tiles['┌'].slice();pose[row*COLS+base+7]=tiles['┐'].slice();
      pose[(row+1)*COLS+base+6]=tiles['└'].slice();pose[(row+1)*COLS+base+7]=tiles['┘'].slice();
    }
    return pose;
  }
  function timeText(date,hour12=false) {
    const h=hour12?(date.getHours()%12||12):date.getHours();
    return String(h).padStart(2,'0')+String(date.getMinutes()).padStart(2,'0');
  }
  const line=a=>[a,a+PI];
  const patterns = [
    {id:'slant',label:'Diagonals',angles:()=>line(PI/4)},
    {id:'corners',label:'Corners',angles:()=>[PI/4,PI*.75]},
    {id:'alternating',label:'Alternating',angles:c=>line(c.row%2?PI/4:-PI/4)},
    {id:'rings',label:'Rings',angles:c=>line(c.phi+PI/2)},
    {id:'diamond',label:'Diamond',angles:c=>line(Math.atan2(Math.sign(c.y),Math.sign(c.x))+PI/2)},
    {id:'wave',label:'Wave',angles:c=>line(.75*Math.sin(c.col*.42+c.row*.32))},
    {id:'weave',label:'Weave',angles:c=>line((c.col+c.row)%2?PI/4:-PI/4)},
    {id:'fan',label:'Fan',angles:c=>line(Math.atan2(c.y+6,c.x)+PI/2)},
    {id:'parallel',label:'Parallel',angles:()=>line(0)}
  ];
  function pattern(id) {
    const definition=patterns.find(p=>p.id===id);
    if(!definition) throw new Error('Unknown pattern: '+id);
    return cells.map(definition.angles);
  }
  // Organizing passages use one straight axis across the complete matrix.
  // Keep this restricted vocabulary independent of the manual display catalog.
  const formations = [
    {label:'Horizontal',angle:0},
    {label:'Vertical',angle:PI/2},
    {label:'Falling diagonal',angle:PI/4},
    {label:'Rising diagonal',angle:-PI/4}
  ];
  function destination(start,target,direction=0,turns=0) {
    let delta=wrap(target-start);
    if(direction>0) delta=mod(target-start);
    if(direction<0) delta=-mod(start-target);
    return start+delta+(direction||Math.sign(delta)||1)*turns*TAU;
  }
  // Limits use artistic seconds; rates above 1 explicitly accelerate playback for debugging.
  const MOTION = Object.freeze({maxSpeed:PI/6,maxAcceleration:PI/12,fieldTempo:.55,flowSeconds:24});

  // A subdivided Bernstein hull bounds the whole polynomial, not just sampled frames.
  function hullBound(points,depth=3) {
    if(!depth) return Math.max(...points.map(Math.abs));
    const left=[points[0]],right=[points.at(-1)];
    let row=points;
    while(row.length>1) {
      row=row.slice(1).map((v,i)=>(v+row[i])/2);
      left.push(row[0]);right.unshift(row.at(-1));
    }
    return Math.max(hullBound(left,depth-1),hullBound(right,depth-1));
  }
  function hullWithin(points,limit,depth=3) {
    if(points.every(v=>Math.abs(v)<=limit)) return true;
    if(!depth||Math.abs(points[0])>limit||Math.abs(points.at(-1))>limit) return false;
    const left=[points[0]],right=[points.at(-1)];let row=points;
    while(row.length>1) {
      row=row.slice(1).map((v,i)=>(v+row[i])/2);
      left.push(row[0]);right.unshift(row.at(-1));
    }
    return hullWithin(left,limit,depth-1)&&hullWithin(right,limit,depth-1);
  }
  class Segment {
    constructor(start,duration,from,to,coefficients=null) {
      this.start=start;this.duration=duration;this.end=start+duration;
      this.from=from.slice();this.to=to.slice();
      const [p,v,a]=from,T=duration,c0=p,c1=v*T,c2=a*T*T/2;
      const d=to[0]-c0-c1-c2,e=to[1]*T-c1-2*c2,f=to[2]*T*T-2*c2;
      this.c=coefficients||[c0,c1,c2,10*d-4*e+f/2,-15*d+7*e-f,6*d-3*e+f/2];
    }
    sample(time) {
      if(time<=this.start) return this.from.slice();
      if(time>=this.end) return this.to.slice();
      const u=(time-this.start)/this.duration,c=this.c,T=this.duration;
      return [c[0]+u*(c[1]+u*(c[2]+u*(c[3]+u*(c[4]+u*c[5])))),
        (c[1]+u*(2*c[2]+u*(3*c[3]+u*(4*c[4]+u*5*c[5]))))/T,
        (2*c[2]+u*(6*c[3]+u*(12*c[4]+u*20*c[5])))/(T*T)];
    }
    derivatives() {
      const c=this.c,T=this.duration,[a,b,d,e,f]=c.slice(1).map((v,i)=>v*(i+1)/T);
      const v=[a,a+b/4,a+b/2+d/6,a+3*b/4+d/2+e/4,a+b+d+e+f];
      return [v,v.slice(1).map((n,i)=>4*(n-v[i])/T)];
    }
    bounds() {
      const [v,a]=this.derivatives();
      return {speed:hullBound(v),acceleration:hullBound(a)};
    }
    withinLimits() {
      const [v,a]=this.derivatives();
      return hullWithin(v,MOTION.maxSpeed)&&hullWithin(a,MOTION.maxAcceleration);
    }
  }
  function rampDuration(v,a) {
    if(Math.abs(a)<1e-12) return 0;
    const room=MOTION.maxSpeed-(a>0?v:-v);
    return Math.min(.6,Math.max(0,room)*1.6/Math.abs(a));
  }
  function accelerationCoefficients(from,to,T) {
    return [from[0],from[1]*T,from[2]*T*T/2,(to[2]-from[2])*T*T/6,0,0];
  }
  class Score {
    constructor(states) {
      this.initial=states.map(s=>s.slice());this.states=states.map(s=>s.slice());
      this.tracks=states.map(()=>[]);this.duration=0;this.marks=[];
    }
    add(h,start,duration,to,coefficients=null) {
      this.tracks[h].push(new Segment(start,duration,this.states[h],to,coefficients));
      this.states[h]=to.slice();
    }
    hold(duration) {
      if(this.states.some(s=>Math.abs(s[1])+Math.abs(s[2])>1e-8)) throw new Error('Only a resting pose can hold.');
      for(let h=0;h<COUNT*2;h++) this.add(h,this.duration,duration,this.states[h]);
      this.duration+=duration;return this;
    }
    prependHold(duration) {
      if(duration<=1e-8) return this;
      if(this.initial.some(s=>Math.abs(s[1])+Math.abs(s[2])>1e-8)) throw new Error('Only a resting pose can wait before departure.');
      this.tracks.forEach((track,h)=>{
        track.forEach(s=>{s.start+=duration;s.end+=duration;});
        track.unshift(new Segment(0,duration,this.initial[h],this.initial[h]));
      });
      this.marks.forEach(m=>m.at+=duration);this.duration+=duration;return this;
    }
    // Acceleration ramps retain velocity; no common resting pose is introduced.
    // With zero acceleration at the middle connector's endpoints, extending it
    // reduces travel demand without magnifying inherited endpoint acceleration.
    bridge(targets,duration=6,options={}) {
      const {direction=()=>0,turns=0,swap=false}=options,plans=[];
      for(const c of cells) {
        const h=2*c.i,src=[this.states[h],this.states[h+1]];
        const route=pair=>pair.map((s,j)=>[destination(src[j][0],s[0],direction(c,j),turns),s[1],s[2]]);
        let to=route([targets[h],targets[h+1]]);
        if(swap) {
          const alt=route([targets[h+1],targets[h]]);
          const cost=pair=>pair.reduce((sum,s,j)=>sum+Math.abs(s[0]-src[j][0]),0);
          if(cost(alt)<cost(to)-.01) to=alt;
        }
        for(let j=0;j<2;j++) {
          const from=src[j],goal=to[j];
          for(const s of [from,goal]) {
            if(!s.every(Number.isFinite)||Math.abs(s[1])>MOTION.maxSpeed+1e-7||Math.abs(s[2])>MOTION.maxAcceleration+1e-7) throw new Error('Transition endpoint exceeds motion limits.');
          }
          const head=rampDuration(from[1],from[2]),tail=rampDuration(goal[1],-goal[2]);
          const a=head?[from[0]+from[1]*head+from[2]*head*head/3,from[1]+from[2]*head/2,0]:from;
          const b=tail?[goal[0]-goal[1]*tail+goal[2]*tail*tail/3,goal[1]-goal[2]*tail/2,0]:goal;
          plans.push({from,goal,head,tail,a,b,free:!turns&&!direction(c,j)});
        }
      }
      let T=Math.max(duration,2,...plans.map(p=>p.head+p.tail+1)),middle;
      for(let attempt=0;attempt<100;attempt++) {
        const fits=s=>s.withinLimits();
        middle=plans.map(p=>{
          const make=shift=>new Segment(this.duration+p.head,T-p.head-p.tail,p.a,[p.b[0]+shift,p.b[1],p.b[2]]);
          const direct=make(0);
          if(fits(direct)||!p.free) return direct;
          // A moving hand may reach an equivalent angle sooner by continuing its
          // rotation than by reversing twice along the shortest angular route.
          return [make(-TAU),make(TAU)].find(fits)||direct;
        });
        const safe=middle.every(fits);
        if(safe) break;

/* Canvas is a projection only. Director is also executable in Node for numerical

(() => {
  const C=ClockCore,$=id=>document.getElementById(id),canvas=$('clock'),ctx=canvas.getContext('2d');

  });

    if(key==='t') act(()=>player.showTime(Date.now()));
  });

  window.addEventListener('resize',resize);
  resize();updateUi();requestAnimationFrame(frame);
})();
